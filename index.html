<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Smart Study Planner</title>
  <link rel="stylesheet" href="./output.css">
   <script src="script.js" defer ></script>
   <link rel="icon" href="./src/fevicon.png">
</head>
<body class="bg-gray-50 flex justify-center items-center flex-col min-h-screen w-full m-0 p-0 overflow-y-auto">
  <!-- Header -->
  <header class="text-center py-10">
    <h1 class="text-3xl md:text-5xl font-bold text-blue-600">🎓 Smart Study Planner</h1>
    <p class="text-base md:text-lg text-gray-600 mt-2">Plan. Focus. Achieve.</p>
  </header>

  <!-- Main -->
  <main class="flex flex-col items-center grow">
    <button 
      class="bg-blue-600 text-white px-6 py-3 mb-30 rounded-lg shadow 
             hover:bg-blue-700 transition" id="getStartedBtn">
      Get Started
    </button>

    <!-- Quotes -->
    <div class="mt-8 space-y-4 text-center italic text-gray-800 text-sm md:text-base" id="quotes">
     
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center text-xs text-gray-500 mt-6">
  © 2026 Study Smart: Study Planner — Built from my idea with guidance from Microsoft Copilot
</footer>


 
</body>
</html>
